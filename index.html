      }
    }

    async function loadCategories() {
      try {
        const response = await fetch('data/categories.json');
        if (!response.ok) {
          throw new Error('无法加载分类数据');
        }
        const data = await response.json();
        renderCategories(data.categories);
      } catch (error) {
        console.error('加载分类失败:', error);
      }
    }

    function renderCategories(categories) {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = categories.map(cat => `
        <span class="cat-item ${cat.active ? 'active' : ''}" onclick="filterByCategory('${cat.id}', this)">${cat.name}</span>
      `).join('');
    }

    function renderApps(appsToRender) {
      const grid = document.getElementById('softwareGrid');
      const loading = document.getElementById('loading');

      loading.classList.add('active');
      grid.innerHTML = '';

      setTimeout(() => {
        if (appsToRender.length === 0) {
          grid.innerHTML = '<div class="no-results">未找到匹配的软件</div>';
        } else {
          appsToRender.forEach(app => {
            const defaultVersion = app.versions[0];
            const card = document.createElement('div');
            card.className = 'app-card';
            const iconHtml = app.icon && app.icon.endsWith('.ico') 
              ? `<img src="${app.icon}" alt="${app.name}" onerror="this.style.display='none'; this.parentElement.classList.add('icon-fallback'); this.parentElement.innerHTML='📦';">`
              : `<div class="${app.icon}"></div>`;
            card.innerHTML = `
              <div class="app-icon">${iconHtml}</div>
              ${app.open_source && app.repo_url ? `<a href="${app.repo_url}" target="_blank" class="github-icon" title="GitHub仓库"><img src="/icons/githubico.ico" alt="GitHub"></a>` : ''}
              <h2 class="app-name">${app.name}</h2>
              <div class="app-meta"><span>${defaultVersion.version}</span><span>${defaultVersion.size}</span></div>
              <p class="app-description">${app.description}</p>
              <div class="app-footer">
                <span class="price">$${defaultVersion.price} <small>永久</small></span>
                <button class="btn" onclick="showVersionModal(${app.id})">购买</button>
              </div>
            `;
            grid.appendChild(card);
          });
        }
        
        loading.classList.remove('active');
        
        // 在网格下方显示申请资源链接
        const requestResourceElement = document.createElement('div');
        requestResourceElement.className = 'request-resource';
        requestResourceElement.style.cssText = 'text-align: center; margin-top: 3rem;';
        requestResourceElement.innerHTML = `
          <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAO__qyRdOtUMVEzV09JVElIWUtWQ0ZGSTZaS1c4TU1UQi4u" target="_blank" style="font-size: 0.85rem; color: #666; text-decoration: underline;">没找到结果？申请资源</a>
        `;
        
        // 找到网格容器的父元素，在网格后面添加申请资源链接
        const gridParent = grid.parentElement;
        if (gridParent) {
          // 先检查是否已经存在申请资源链接，如果存在则移除
          const existingRequestElement = gridParent.querySelector('.request-resource');
          if (existingRequestElement) {
            existingRequestElement.remove();
          }
          // 在网格后面添加新的申请资源链接
          gridParent.insertBefore(requestResourceElement, grid.nextSibling);
        }
      }, 300);
    }

    let currentAppId = null;
    let selectedVersion = null;

    function showVersionModal(appId) {
      currentAppId = appId;
      selectedVersion = null;
      const app = apps.find(a => a.id === appId);
      
      document.getElementById('versionModalTitle').textContent = `${app.name} - 选择版本`;
      
      const versionList = document.getElementById('versionList');
      versionList.innerHTML = app.versions.map((ver, index) => {
        const isPaid = ver.price > 0;
        const buyButton = isPaid ? `
          <button class="version-select-btn" onclick="buyVersion(${index}); event.stopPropagation();">去购买</button>
        ` : '';
        return `
          <div class="version-item" onclick="downloadVersion(${index})" data-index="${index}">
            <div class="version-info">
              <div class="version-name">${ver.name}</div>
              <div class="version-detail">${ver.version} · ${ver.size}</div>
            </div>
            <div class="version-price">$${ver.price}</div>
            ${buyButton}
            <button class="version-select-btn" onclick="downloadVersion(${index}); event.stopPropagation();">下载</button>
          </div>
        `;
      }).join('');
      
      const requestVersionElement = document.createElement('div');
      requestVersionElement.style.cssText = 'margin-top: 1.5rem; text-align: center;';
      requestVersionElement.innerHTML = `
        <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAO__qyRdOtUMVEzV09JVElIWUtWQ0ZGSTZaS1c4TU1UQi4u" target="_blank" style="font-size: 0.85rem; color: #666; text-decoration: underline;">没有你想要的版本？申请一下</a>
      `;
      document.getElementById('versionList').appendChild(requestVersionElement);
      
      document.getElementById('versionModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function downloadVersion(index) {
      const app = apps.find(a => a.id === currentAppId);
      const version = app.versions[index];
      
      if (version.download) {
        const downloadPath = version.download;
        const isLocalPath = downloadPath.startsWith('file://') || !downloadPath.startsWith('http');
        
        if (isLocalPath) {
          const link = document.createElement('a');
          link.href = downloadPath;
          link.download = downloadPath.split('/').pop() || `${app.name}_${version.name}.zip`;
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          setTimeout(() => {
            document.body.removeChild(link);
          }, 100);
        } else {
          window.open(downloadPath, '_blank');
        }
        showNotification(`${app.name} ${version.name} 开始下载`, 'success');
      } else {
        showNotification('下载链接不存在', 'error');
      }
      
      closeVersionModal();
    }
    
    function buyVersion(index) {
      const app = apps.find(a => a.id === currentAppId);
      const version = app.versions[index];
      
      const buyUrl = prompt('请输入购买链接:', 'https://example.com/buy');
      if (buyUrl) {
        window.open(buyUrl, '_blank');
        showNotification('跳转到购买页面', 'success');
      }
    }

    function closeVersionModal() {
      document.getElementById('versionModal').classList.remove('active');
      document.body.style.overflow = '';
      currentAppId = null;
      selectedVersion = null;
    }

    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type} show`;

      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    function showHome() {
      currentCategory = 'all';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.cat-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector('.cat-item').classList.add('active');
      renderApps(apps);
    }

    function showAllApps() {
      showHome();
    }

    function showSupport() {
      showNotification('支持功能开发中...', 'success');
    }

    function showTerms() {
      showNotification('服务条款页面开发中...', 'success');
    }

    function showPrivacy() {
      showNotification('隐私政策页面开发中...', 'success');
    }

    function showHelp() {
      showNotification('帮助中心页面开发中...', 'success');
    }

    function showAbout() {
      showNotification('关于我们页面开发中...', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadApps();
      loadCategories();

      document.addEventListener('click', (e) => {
        const versionModal = document.getElementById('versionModal');
        if (e.target === versionModal) {
          closeVersionModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeVersionModal();
        }
      });
    });

    window.onerror = function(message, source, lineno, colno, error) {
      console.error('Global error:', { message, source, lineno, colno, error });
      showNotification('发生错误，请刷新页面重试', 'error');
      return true;
    };
  </script>
