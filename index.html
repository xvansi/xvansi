<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天穹共和国 · 档案</title>
    <style>
        /* ========== 浅蓝 · 模块化 · 全自动循环动画 ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-body: #eaf3fb;
            --bg-gradient: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9) 0%, transparent 45%),
                           radial-gradient(circle at 80% 80%, rgba(190,222,245,0.6) 0%, transparent 50%),
                           linear-gradient(150deg, #e6f0f9 0%, #d4e6f5 50%, #e0edf8 100%);
            --bg-card: #ffffff;
            --bg-card-hover: #fafcff;
            --bg-sidebar: linear-gradient(180deg, #f2f8fe 0%, #e8f2fa 100%);
            --text-primary: #162433;
            --text-secondary: #42566a;
            --text-muted: #8199ad;
            --accent: #1a7a8a;
            --accent-light: #2b9db0;
            --accent-blue: #2b7a9e;
            --accent-blue-light: #4a9bbf;
            --accent-blue-soft: #dceef9;
            --accent-teal: #00897b;
            --accent-teal-soft: #d6ebe7;
            --border-light: #ddeaf4;
            --border-medium: #c4d8e8;
            --highlight-bg: #fef6d8;
            --shadow-sm: 0 2px 8px rgba(43, 122, 158, 0.05), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 8px 28px rgba(43, 122, 158, 0.10), 0 2px 8px rgba(0,0,0,0.03);
            --shadow-lg: 0 20px 48px rgba(43, 122, 158, 0.14), 0 4px 12px rgba(0,0,0,0.04);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 8px;
            --font-sans: 'Inter', 'Segoe UI', 'Noto Sans', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
            --line-height: 1.72;
            --max-width: 1100px;
            --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-body);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            font-family: var(--font-sans);
            color: var(--text-primary);
            line-height: var(--line-height);
            padding: 2rem 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景流光自动动画 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
            background:
                radial-gradient(circle at 15% 25%, rgba(74, 155, 191, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(0, 137, 123, 0.06) 0%, transparent 40%);
            animation: bgShift 18s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.08) rotate(1deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
        }

        /* 浮动光斑 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(circle at 30% 40%, rgba(255,255,255,0.5) 0%, transparent 30%),
                radial-gradient(circle at 70% 60%, rgba(200,230,250,0.4) 0%, transparent 35%);
            animation: lightFloat 22s ease-in-out infinite alternate;
        }

        @keyframes lightFloat {
            0% { transform: translate(-2%, -1%) scale(1); opacity: 0.6; }
            100% { transform: translate(2%, 2%) scale(1.1); opacity: 1; }
        }

        /* ========== 布局 ========== */
        .container-fluid {
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
            padding: 0;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.35rem;
            min-height: 70vh;
            animation: fadeInUp 0.8s var(--ease-out) both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(28px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== 侧边目录 ========== */
        #outline-panel {
            flex: 0 0 255px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 1.8rem 1.2rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            position: sticky;
            top: 2rem;
            align-self: flex-start;
            display: none;
            transition: transform 0.4s var(--ease-out), opacity 0.4s var(--ease-out), box-shadow 0.4s;
            animation: slideInLeft 0.7s 0.1s var(--ease-out) both;
            box-shadow: var(--shadow-sm);
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-28px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #outline-panel.hide-none {
            opacity: 0;
            transform: translateX(-20px) scale(0.97);
            pointer-events: none;
        }

        #outline-panel:hover {
            box-shadow: var(--shadow-md);
        }

        #outline-content {
            font-size: 0.9rem;
        }

        #outline-content ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        #outline-content li {
            margin-bottom: 0.45rem;
            line-height: 1.5;
            animation: fadeInItem 0.5s var(--ease-out) both;
        }

        @keyframes fadeInItem {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #outline-content li ul {
            padding-left: 1.1rem;
            margin-top: 0.3rem;
        }

        #outline-content a {
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            padding: 0.4rem 0.7rem 0.4rem 0.85rem;
            border-left: 2px solid transparent;
            border-radius: 0 10px 10px 0;
            transition: all 0.3s var(--ease-spring);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
        }

        #outline-content a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 2px;
            height: 70%;
            background: var(--accent-blue);
            border-radius: 2px;
            transition: transform 0.3s var(--ease-spring);
        }

        #outline-content a:hover {
            color: var(--accent-blue);
            background: var(--accent-blue-soft);
            padding-left: 1.1rem;
        }

        #outline-content a:hover::before {
            transform: translateY(-50%) scaleY(1);
        }

        #outline-content a.outline-bold {
            font-weight: 650;
            color: var(--accent-blue);
            background: var(--accent-blue-soft);
            padding-left: 1.1rem;
        }

        #outline-content a.outline-bold::before {
            transform: translateY(-50%) scaleY(1);
        }

        /* 目录项自动循环高亮 */
        #outline-content li.auto-cycle a {
            animation: tocScan 7s infinite;
        }

        @keyframes tocScan {
            0%, 88%, 100% {
                background: transparent;
                color: var(--text-secondary);
                padding-left: 0.85rem;
                border-left-color: transparent;
            }
            5%, 20% {
                background: var(--accent-blue-soft);
                color: var(--accent-blue);
                padding-left: 1.1rem;
                border-left-color: var(--accent-blue);
            }
        }

        /* ========== 主内容区 ========== */
        #post-content {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1.35rem;
            transition: flex-basis 0.4s var(--ease-out);
        }

        /* 内容模块卡片 */
        .content-module {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            padding: 2.1rem 2.4rem;
            transition: box-shadow 0.4s var(--ease-out), transform 0.4s var(--ease-out), border-color 0.4s;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.7s var(--ease-out) both;
        }

        .content-module:nth-child(1) { animation-delay: 0.08s; }
        .content-module:nth-child(2) { animation-delay: 0.16s; }
        .content-module:nth-child(3) { animation-delay: 0.24s; }

        /* 模块顶部扫描线 — 自动循环 */
        .content-module::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-blue-light), var(--accent-teal), var(--accent-blue-light), transparent);
            background-size: 200% 100%;
            opacity: 0.8;
            animation: topScan 6s linear infinite;
        }

        @keyframes topScan {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 模块悬浮光晕 — 自动循环 */
        .content-module::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(43,122,158,0.06), transparent 40%, rgba(0,137,123,0.04));
            opacity: 0;
            pointer-events: none;
            animation: cardGlow 8s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .content-module:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
            border-color: var(--border-medium);
            background: var(--bg-card-hover);
        }

        /* 模块编号 */
        .content-module .module-badge {
            position: absolute;
            top: 1.1rem;
            right: 1.3rem;
            font-size: 0.68rem;
            font-weight: 650;
            letter-spacing: 0.08em;
            color: var(--accent-blue);
            background: var(--accent-blue-soft);
            padding: 0.22rem 0.7rem;
            border-radius: 20px;
            opacity: 0.65;
            transition: opacity 0.3s, transform 0.3s var(--ease-spring);
            animation: badgePulse 5s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 0.65; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .content-module:hover .module-badge {
            opacity: 1;
            transform: scale(1.08);
            animation: none;
        }

        /* ========== 排版 ========== */
        #vx-content {
            font-size: 1.02rem;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 650;
            line-height: 1.3;
            color: #0d1a26;
            margin-top: 1.8rem;
            margin-bottom: 0.75rem;
            letter-spacing: -0.015em;
            scroll-margin-top: 2rem;
        }

        h1:first-child, h2:first-child, h3:first-child {
            margin-top: 0;
        }

        h1 {
            font-size: 2.15rem;
            margin-top: 0.2rem;
            margin-bottom: 1.4rem;
            padding-bottom: 0.7rem;
            border-bottom: 3px solid var(--accent-blue);
            display: inline-block;
            color: #081420;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-teal), var(--accent-blue-light), var(--accent-teal));
            background-size: 200% 100%;
            width: 100%;
            animation: titleFlow 4s linear infinite;
        }

        @keyframes titleFlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        h2 {
            font-size: 1.55rem;
            margin-top: 2rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--border-medium);
            color: #14202e;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 44px;
            height: 2px;
            background: var(--accent-blue);
            border-radius: 2px;
            animation: h2Line 5s ease-in-out infinite;
        }

        @keyframes h2Line {
            0%, 100% { width: 44px; background: var(--accent-blue); }
            50% { width: 100px; background: var(--accent-blue-light); }
        }

        h3 {
            font-size: 1.25rem;
            margin-top: 1.6rem;
            color: #1b2938;
        }

        p {
            margin: 0.8rem 0;
            color: var(--text-primary);
        }

        /* 引用块 — 自动呼吸 */
        blockquote {
            margin: 1.4rem 0;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #f0f8fd 0%, #e6f2fa 100%);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: #1c3040;
            font-style: italic;
            font-size: 1.05rem;
            box-shadow: var(--shadow-sm);
            animation: quoteBreath 6s ease-in-out infinite;
        }

        @keyframes quoteBreath {
            0%, 100% {
                border-left-color: var(--accent-blue);
                box-shadow: var(--shadow-sm);
            }
            50% {
                border-left-color: var(--accent-teal);
                box-shadow: 0 4px 20px rgba(43, 122, 158, 0.15);
            }
        }

        blockquote p { margin: 0; }

        mark {
            background: var(--highlight-bg);
            color: #5a4a18;
            padding: 0.12em 0.38em;
            border-radius: 5px;
            font-weight: 500;
            animation: markGlow 4s ease-in-out infinite;
        }

        @keyframes markGlow {
            0%, 100% { background: var(--highlight-bg); box-shadow: none; }
            50% { background: #fdeaa8; box-shadow: 0 0 0 3px rgba(253, 234, 168, 0.45); }
        }

        s {
            color: #8f9faf;
            text-decoration-thickness: 1.5px;
        }

        hr {
            margin: 1.8rem 0;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-medium), transparent);
            animation: hrFlow 6s ease-in-out infinite;
        }

        @keyframes hrFlow {
            0%, 100% { background: linear-gradient(90deg, transparent, var(--border-medium), transparent); }
            50% { background: linear-gradient(90deg, transparent, var(--accent-blue-light), transparent); }
        }

        ul {
            margin: 0.75rem 0;
            padding-left: 1.7rem;
        }

        li {
            margin-bottom: 0.45rem;
            line-height: 1.65;
            color: var(--text-primary);
            transition: transform 0.2s var(--ease-spring), color 0.2s;
        }

        li:hover {
            transform: translateX(4px);
            color: #081420;
        }

        li::marker {
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* 列表项自动循环扫描 */
        li.auto-scan {
            animation: listScan 9s infinite;
        }

        @keyframes listScan {
            0%, 91%, 100% {
                transform: translateX(0);
                color: var(--text-primary);
                font-weight: normal;
            }
            3%, 8% {
                transform: translateX(5px);
                color: var(--accent-blue);
                font-weight: 550;
            }
        }

        a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed transparent;
            transition: color 0.2s, border-color 0.3s, background 0.2s;
            word-break: break-word;
        }

        a:hover {
            color: var(--accent-blue-light);
            border-bottom-color: var(--accent-blue-light);
            background: rgba(74, 155, 191, 0.07);
            padding: 0.05em 0.15em;
            border-radius: 3px;
        }

        /* 锚点图标 */
        .vx-header-anchor {
            visibility: hidden;
            margin-left: 0.5rem;
            font-weight: 400;
            font-size: 0.9em;
            color: var(--accent-blue);
            opacity: 0;
            text-decoration: none;
            border-bottom: none;
            transition: opacity 0.3s, transform 0.2s var(--ease-spring);
            display: inline-block;
        }

        h1:hover .vx-header-anchor,
        h2:hover .vx-header-anchor,
        h3:hover .vx-header-anchor {
            visibility: visible;
            opacity: 0.7;
        }

        .vx-header-anchor:hover {
            opacity: 1 !important;
            transform: scale(1.2);
        }

        .vx-header-anchor::after { content: "¶"; }

        /* ========== 浮动按钮 ========== */
        #container-floating {
            display: none;
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            animation: floatIn 0.6s 0.5s var(--ease-spring) both;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #floating-button {
            width: 3.1rem;
            height: 3.1rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-teal) 100%);
            background-size: 200% 200%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 1.5rem;
            font-weight: 300;
            user-select: none;
            position: relative;
            overflow: hidden;
            animation: btnGradient 8s ease infinite, btnFloat 4s ease-in-out infinite;
            box-shadow: 0 6px 22px rgba(43, 122, 158, 0.35);
            transition: transform 0.3s var(--ease-spring), box-shadow 0.3s;
        }

        @keyframes btnGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes btnFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        #floating-button:hover {
            transform: translateY(-6px) scale(1.08);
            box-shadow: 0 14px 34px rgba(43, 122, 158, 0.5);
        }

        #floating-button:active {
            transform: scale(0.95) translateY(0);
        }

        #floating-button .more {
            line-height: 1;
            margin: 0;
            font-family: var(--font-sans);
            transform: translateY(-1px);
            position: relative;
            z-index: 1;
        }

        /* 脉冲环 */
        #floating-button::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: var(--accent-blue-light);
            opacity: 0;
            z-index: -1;
            animation: pulseRing 2.8s infinite 1s;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.9); opacity: 0.4; }
            70% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #b8cfe0;
            border-radius: 8px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover { background: #98b8d0; }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            #outline-panel {
                flex: 0 0 220px;
                padding: 1.5rem 1rem;
            }
            .content-module { padding: 1.8rem 1.8rem; }
        }

        @media (max-width: 768px) {
            body { padding: 1rem 0.75rem; }
            .row { gap: 1rem; }
            #outline-panel, #container-floating { display: none !important; }
            .content-module {
                padding: 1.5rem 1.35rem;
                border-radius: var(--radius-sm);
            }
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.4rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.25rem; }
            h3 { font-size: 1.1rem; }
            .content-module { padding: 1.2rem 1rem; }
        }

        /* ========== 打印 ========== */
        @media print {
            body { background: white; background-image: none; padding: 0.5in; }
            body::before, body::after { display: none; }
            .row { display: block; }
            .content-module {
                box-shadow: none;
                border: 1px solid #ccc;
                margin-bottom: 1rem;
                animation: none;
            }
            #outline-panel, #container-floating { display: none !important; }
            .content-module::before, .content-module::after,
            h1::after, h2::after, #floating-button::before { display: none; }
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边目录 -->
            <div id="outline-panel" class="bd-toc">
                <div id="outline-content" class="section-nav"></div>
            </div>

            <!-- 主内容区 -->
            <div id="post-content" class="bd-content">
                <!-- 模块 1 -->
                <div class="content-module">
                    <span class="module-badge">MOD · 01</span>
                    <div id="vx-content">
                        <h1 id="天穹共和国">天穹共和国<a class="vx-header-anchor" href="#天穹共和国" aria-label="锚点链接"></a></h1>
                        <h2 id="简介">简介<a class="vx-header-anchor" href="#简介" aria-label="锚点链接"></a></h2>
                        <blockquote>
                            <p>为了伟大的天穹共和国！</p>
                        </blockquote>
                        <p><mark>天穹共和国</mark>，是一座建立在<s>太阳</s>之上的国家。<br>
                        据官方记载，天穹共和国第一任主席为<font color="blue">王子鹤</font><em>(2013?~?)</em>，国土面积广阔，机构完善，实为安居乐业之所也。</p>
                    </div>
                </div>

                <!-- 模块 2 -->
                <div class="content-module">
                    <span class="module-badge">MOD · 02</span>
                    <h2 id="国家基本信息">国家基本信息<a class="vx-header-anchor" href="#国家基本信息" aria-label="锚点链接"></a></h2>
                    <h3 id="1国家机构">1. 国家机构<a class="vx-header-anchor" href="#1国家机构" aria-label="锚点链接"></a></h3>
                    <p>据目前已知消息，天穹共和国有如下国家机构：</p>
                    <ul>
                        <li>天穹 I 统计库</li>

                <!-- 模块 3 -->
                <div class="content-module">
                    <span class="module-badge">MOD · 03</span>
                    <h2 id="机密文件">机密文件<a class="vx-header-anchor" href="#机密文件" aria-label="锚点链接"></a></h2>

    <!-- 浮动按钮 -->
    <div id="container-floating">
        <div id="floating-button" onclick="toggleMore()" role="button" aria-label="切换目录">
            <p id="floating-more" class="more">&gt;</p>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            var vxOutlineToc = [];
            var outlinePanel = document.getElementById('outline-panel');
            var postContent = document.getElementById('post-content');
            var outlineContent = document.getElementById('outline-content');
            var floatingContainer = document.getElementById('container-floating');

            function escapeHtml(text) {
                var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            function buildToc() {
                var headers = postContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
                vxOutlineToc = [];
                for (var i = 0; i < headers.length; i++) {
                    var header = headers[i];
                    vxOutlineToc.push({
                        level: parseInt(header.tagName.substring(1), 10),
                        anchor: header.id || '',
                        title: escapeHtml(header.textContent || header.innerText || '')
                    });
                }
                return vxOutlineToc;
            }

            function baseLevelOfToc(toc) {
                if (!toc.length) return 1;
                var minLevel = toc[0].level;
                for (var i = 1; i < toc.length; i++) {
                    if (toc[i].level < minLevel) minLevel = toc[i].level;
                }
                return minLevel;
            }

            function toPerfectToc(toc, baseLevel) {
                var curLevel = baseLevel - 1;
                var perfect = [];
                for (var i = 0; i < toc.length; i++) {
                    var item = toc[i];
                    while (item.level > curLevel + 1) {
                        curLevel += 1;
                        perfect.push({ level: curLevel, anchor: '', title: '[EMPTY]' });
                    }
                    perfect.push(item);
                    curLevel = item.level;
                }
                return perfect;
            }

            function tocToTree(toc, baseLevel) {
                if (!toc.length) return '<ul></ul>';
                var front = '<li>';
                var ending = ['</li>'];
                var curLevel = baseLevel;
                for (var i = 0; i < toc.length; i++) {
                    var item = toc[i];
                    if (item.level === curLevel) {
                        front += '</li><li>';
                        front += '<a href="#' + item.anchor + '" title="' + item.title + '" data-anchor="' + item.anchor + '">' + item.title + '</a>';
                    } else if (item.level > curLevel) {
                        front += '<ul><li>';
                        front += '<a href="#' + item.anchor + '" title="' + item.title + '" data-anchor="' + item.anchor + '">' + item.title + '</a>';
                        ending.push('</li></ul>');
                        curLevel = item.level;
                    } else {
                        while (item.level < curLevel) {
                            var ele = ending.pop();
                            front += ele;
                            if (ele === '</li></ul>') curLevel--;
                        }
                        front += '</li><li>';
                        front += '<a href="#' + item.anchor + '" title="' + item.title + '" data-anchor="' + item.anchor + '">' + item.title + '</a>';
                    }
                }
                while (ending.length) front += ending.pop();
                front = front.replace(/<li><\/li>/g, '');
                return '<ul>' + front + '</ul>';
            }

            function setOutlinePanelVisible(visible) {
                if (!outlinePanel) return;
                if (visible) {
                    outlinePanel.classList.remove('hide-none');
                    outlinePanel.style.display = 'block';
                } else {
                    outlinePanel.classList.add('hide-none');
                }
                if (postContent) {
                    if (visible) postContent.classList.remove('col-expand');
                    else postContent.classList.add('col-expand');
                }
            }

            function isOutlinePanelVisible() {
                if (!outlinePanel) return false;
                return !outlinePanel.classList.contains('hide-none');
            }

            window.toggleMore = function() {
                if (!vxOutlineToc.length) return;
                var p = document.getElementById('floating-more');
                if (isOutlinePanelVisible()) {
                    setOutlinePanelVisible(false);
                    if (p) p.textContent = '>';
                } else {
                    setOutlinePanelVisible(true);
                    if (p) p.textContent = '<';
                }
            };

            function highlightItemOnlyInOutline(id) {
                if (!outlineContent) return;
                var links = outlineContent.querySelectorAll('a');
                for (var i = 0; i < links.length; i++) {
                    var link = links[i];
                    link.classList.remove('outline-bold');
                    if (link.getAttribute('data-anchor') === id) link.classList.add('outline-bold');
                }
            }

            var scrollTimeout = null;
            window.addEventListener('scroll', function() {
                if (scrollTimeout) return;
                scrollTimeout = setTimeout(function() {
                    scrollTimeout = null;
                    if (!vxOutlineToc.length || !isOutlinePanelVisible()) return;
                    var scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                    var headers = postContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
                    if (!headers.length) return;
                    var idx = -1;
                    var bias = scrollTop + 80;
                    for (var i = 0; i < headers.length; i++) {
                        if (bias >= headers[i].offsetTop) idx = i;
                        else break;
                    }
                    var currentId = '';
                    if (idx !== -1) currentId = headers[idx].id || '';
                    highlightItemOnlyInOutline(currentId);
                }, 80);
            }, { passive: true });

            function initToc() {
                buildToc();

                if (!vxOutlineToc.length) {
                    setOutlinePanelVisible(false);
                    if (floatingContainer) floatingContainer.style.display = 'none';
                    return;
                }

                var baseLevel = baseLevelOfToc(vxOutlineToc);
                var perfect = toPerfectToc(vxOutlineToc, baseLevel);
                var treeHtml = tocToTree(perfect, baseLevel);

                if (outlineContent) {
                    outlineContent.innerHTML = treeHtml;
                    // 目录项自动循环高亮
                    var items = outlineContent.querySelectorAll('li');
                    items.forEach(function(li, index) {
                        li.classList.add('auto-cycle');
                        li.style.animationDelay = (index * 0.9) + 's';
                    });
                }

                setOutlinePanelVisible(true);

                if (floatingContainer) {
                    floatingContainer.style.display = 'block';
                    var p = document.getElementById('floating-more');
                    if (p) p.textContent = '<';
                }

                // 正文列表项自动扫描
                var contentItems = postContent.querySelectorAll('li');
                contentItems.forEach(function(li, index) {
                    li.classList.add('auto-scan');
                    li.style.animationDelay = (index * 0.6 + 1.5) + 's';
                });

                // 启动自动滚动高亮循环（模拟无操作时目录高亮跟随滚动）
                startAutoHighlightLoop();
            }

            // 自动循环高亮目录项 — 模拟阅读位置滚动
            var autoHighlightTimer = null;
            var autoHighlightIndex = 0;
            var allHeaders = [];

            function startAutoHighlightLoop() {
                allHeaders = postContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
                if (!allHeaders.length) return;

                if (autoHighlightTimer) clearInterval(autoHighlightTimer);

                autoHighlightTimer = setInterval(function() {
                    // 如果用户正在滚动或悬停目录，暂停自动循环
                    if (scrollTimeout) return;
                    if (!isOutlinePanelVisible()) return;

                    autoHighlightIndex = (autoHighlightIndex + 1) % allHeaders.length;
                    var currentHeader = allHeaders[autoHighlightIndex];
                    if (currentHeader && currentHeader.id) {
                        highlightItemOnlyInOutline(currentHeader.id);
                    }
                }, 2800); // 每2.8秒切换一次
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initToc);
            } else {
                initToc();
            }

            // 平滑滚动
            document.addEventListener('click', function(e) {
                var anchor = e.target.closest('a[href^="#"]');
                if (!anchor) return;
                var href = anchor.getAttribute('href');
                if (!href || href === '#') return;
                var targetEl = document.querySelector(href);
                if (!targetEl) return;
                e.preventDefault();
                var headerOffset = 20;
                var elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
                var offsetPosition = elementPosition - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                if (history.pushState) history.pushState(null, null, href);
            });
        })();
    </script>
</body>
