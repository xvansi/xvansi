        showNotification('加载软件数据失败，请刷新页面重试', 'error');

        }
        const data = await response.json();
        renderCategories(data.categories);
      } catch (error) {
        console.error('加载分类失败:', error);
      }
    }

    function renderCategories(categories) {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = categories.map(cat => `
        <span class="cat-item ${cat.active ? 'active' : ''}" onclick="filterByCategory('${cat.id}', this)">${cat.name}</span>
      `).join('');
    }

    function renderApps(appsToRender) {
      const grid = document.getElementById('softwareGrid');
      const loading = document.getElementById('loading');

      loading.classList.add('active');
      grid.innerHTML = '';

      setTimeout(() => {
        if (appsToRender.length === 0) {
          grid.innerHTML = '<div class="no-results">未找到匹配的软件</div>';
        } else {
          appsToRender.forEach(app => {
            const defaultVersion = app.versions[0];
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
              <div class="app-icon ${app.icon}"></div>
              <h2 class="app-name">${app.name}</h2>
              <div class="app-meta"><span>${defaultVersion.version}</span><span>${defaultVersion.size}</span></div>
              <p class="app-description">${app.description}</p>
              <div class="app-footer">
                <span class="price">$${defaultVersion.price} <small>永久</small></span>
                <button class="btn" onclick="showVersionModal(${app.id})">购买</button>
              </div>
            `;
            grid.appendChild(card);
          });
        }
        loading.classList.remove('active');
      }, 300);
    }

    let currentAppId = null;
    let selectedVersion = null;

    function showVersionModal(appId) {
      currentAppId = appId;
      selectedVersion = null;
      const app = apps.find(a => a.id === appId);
      
      document.getElementById('versionModalTitle').textContent = `${app.name} - 选择版本`;
      
      const versionList = document.getElementById('versionList');
      versionList.innerHTML = app.versions.map((ver, index) => `
        <div class="version-item" onclick="selectVersion(${index})" data-index="${index}">
          <div class="version-info">
            <div class="version-name">${ver.name}</div>
            <div class="version-detail">${ver.version} · ${ver.size}</div>
          </div>
          <div class="version-price">$${ver.price}</div>
          <button class="version-select-btn">选择</button>
        </div>
      `).join('');
      
      document.getElementById('versionModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function selectVersion(index) {
      const app = apps.find(a => a.id === currentAppId);
      selectedVersion = app.versions[index];
      
      document.querySelectorAll('.version-item').forEach((item, i) => {
        if (i === index) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
      
      setTimeout(() => {
        addVersionToCart(currentAppId, selectedVersion);
        closeVersionModal();
      }, 300);
    }

    function closeVersionModal() {
      document.getElementById('versionModal').classList.remove('active');
      document.body.style.overflow = '';
      currentAppId = null;
      selectedVersion = null;
    }

    function addVersionToCart(appId, version) {
      const app = apps.find(a => a.id === appId);
      const versionIndex = app.versions.findIndex(v => v.version === version.version);
      const cartItem = {
        id: appId,
        name: `${app.name} (${version.name})`,
        price: version.price,
        version: version.version,
        versionName: version.name,
        versionIndex: versionIndex
      };
      
      if (cart.some(item => item.id === appId && item.version === version.version)) {
        showNotification('该版本已在购物车中', 'error');
        return;
      }

      cart.push(cartItem);
      updateCartCount();
      showNotification(`${app.name} ${version.name} 已添加到购物车`, 'success');
    }

    function filterByCategory(category, element) {
      currentCategory = category;
      
      document.querySelectorAll('.cat-item').forEach(item => {
        item.classList.remove('active');
      });
      element.classList.add('active');

      let filteredApps = apps;
      
      if (category !== 'all') {
        filteredApps = apps.filter(app => app.category === category);
      }

      if (searchQuery) {
        filteredApps = filteredApps.filter(app => 
          app.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          app.description.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }

      renderApps(filteredApps);
    }

    function searchApps() {
      searchQuery = document.getElementById('searchInput').value.trim();
      
      let filteredApps = apps;

      if (currentCategory !== 'all') {
        filteredApps = filteredApps.filter(app => app.category === currentCategory);
      }

      if (searchQuery) {
        filteredApps = filteredApps.filter(app => 
          app.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          app.description.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }

      renderApps(filteredApps);
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        searchApps();
      }
    }



    function removeFromCart(appId) {
      cart = cart.filter(item => item.id !== appId);
      updateCartCount();
      renderCart();
      showNotification('软件已从购物车移除', 'success');
    }

    function updateCartCount() {
      document.getElementById('cartCount').textContent = cart.length;
      updateCartFloating();
    }

    function updateCartFloating() {
      const floating = document.getElementById('cartFloating');
      const floatingCount = document.getElementById('cartFloatingCount');
      const floatingTotal = document.getElementById('cartFloatingTotal');

      if (cart.length > 0) {
        floating.classList.add('show');
        floatingCount.textContent = cart.length;
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        if (cart.length >= 3) {
          total = total * 0.75;
        }
        floatingTotal.textContent = '$' + total.toFixed(2);
      } else {
        floating.classList.remove('show');
      }
    }

    function renderCart() {
      const cartItems = document.getElementById('cartItems');
      
      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="text-align: center; padding: 2rem; color: #666;">购物车为空</p>';
        document.getElementById('totalPrice').textContent = '$0';
        return;
      }

      let total = 0;
      cartItems.innerHTML = cart.map(item => {
        total += item.price;
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">$${item.price}</div>
            </div>
            <button class="cart-item-remove" onclick="removeFromCart(${item.id})">移除</button>
          </div>
        `;
      }).join('');

      if (cart.length >= 3) {
        total = total * 0.75;
        cartItems.innerHTML += `
          <div style="text-align: center; padding: 1rem; background: #f0f0f0; border: 2px solid #000; margin-top: 1rem; font-weight: 700;">
            🎉 套装优惠：已自动减免 25%
          </div>
        `;
      }

      document.getElementById('totalPrice').textContent = `$${total.toFixed(2)}`;
    }

    function openCart() {
      renderCart();
      document.getElementById('cartModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function checkout() {
      if (cart.length === 0) {
        showNotification('购物车为空，请先添加软件', 'error');
        return;
      }

      try {
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const finalTotal = cart.length >= 3 ? total * 0.75 : total;
        
        showNotification(`订单提交成功！总计：$${finalTotal.toFixed(2)}`, 'success');
        
        setTimeout(() => {
          const downloadNotification = document.createElement('div');
          downloadNotification.className = 'notification success show';
          downloadNotification.innerHTML = `
            <div style="margin-bottom: 0.5rem; font-weight: bold;">开始下载您的软件</div>
            ${cart.map(item => {
              return `<div style="margin: 0.3rem 0;">📥 ${item.name}</div>`;
            }).join('')}
          `;
          document.body.appendChild(downloadNotification);
          
          cart.forEach((item, index) => {
            setTimeout(() => {
              const app = apps.find(a => a.id === item.id);
              const version = app.versions[item.versionIndex];
              const downloadPath = version.download;
              const fileName = downloadPath.split('/').pop();
              
              const link = document.createElement('a');
              link.href = downloadPath;
              link.download = fileName;
              link.style.display = 'none';
              document.body.appendChild(link);
              link.click();
              setTimeout(() => {
                document.body.removeChild(link);
              }, 100);
            }, index * 500);
          });
          
          setTimeout(() => {
            downloadNotification.classList.remove('show');
            setTimeout(() => {
              downloadNotification.remove();
              cart = [];
              updateCartCount();
              closeCart();
              
              window.open('https://omg10.com/4/10826171', '_blank');
            }, 300);
          }, 5000);
        }, 500);
      } catch (error) {
        showNotification('结算时发生错误，请重试', 'error');
        console.error('Checkout error:', error);
      }
    }

    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type} show`;

      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    function showHome() {
      currentCategory = 'all';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.cat-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector('.cat-item').classList.add('active');
      renderApps(apps);
    }

    function showAllApps() {
      showHome();
    }

    function showSupport() {
      showNotification('支持功能开发中...', 'success');
    }

    function showTerms() {
      showNotification('服务条款页面开发中...', 'success');
    }

    function showPrivacy() {
      showNotification('隐私政策页面开发中...', 'success');
    }

    function showHelp() {
      showNotification('帮助中心页面开发中...', 'success');
    }

    function showAbout() {
      showNotification('关于我们页面开发中...', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadApps();
      loadCategories();

      document.addEventListener('click', (e) => {
        const cartModal = document.getElementById('cartModal');
        const versionModal = document.getElementById('versionModal');
        if (e.target === cartModal) {
          closeCart();
        }
        if (e.target === versionModal) {
          closeVersionModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeCart();
          closeVersionModal();
        }
      });

      const cartIcon = document.querySelector('.cart-icon');
      cartIcon.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCart();
        }
      });
    });

    window.onerror = function(message, source, lineno, colno, error) {
      console.error('Global error:', { message, source, lineno, colno, error });
      showNotification('发生错误，请刷新页面重试', 'error');
      return true;
    };
  </script>
